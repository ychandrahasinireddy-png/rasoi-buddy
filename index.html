<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasoi Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6ee; --panel:#ffffff; --ink:#2b2420; --muted:#7a6f66;
    --accent:#e0791f; --accent-soft:#fde9d6; --accent-ink:#9a4b0b;
    --line:#eee3d4; --user:#2b2420; --userink:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
  .app{max-width:680px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  header{padding:18px 20px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:22px}
  header h1{font-family:Fraunces,serif;font-size:22px;margin:0;line-height:1.1}
  header p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
  .dot.on{background:#3aa55d}
  #chat{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:11px 14px;border-radius:16px;line-height:1.5;animation:pop .18s ease-out}
  .bot{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
  .user{background:var(--user);color:var(--userink);border-top-right-radius:4px;align-self:flex-end}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg p{margin:0 0 8px}.msg p:last-child{margin:0}
  .msg h4{font-family:Fraunces,serif;font-size:16px;margin:12px 0 6px;color:var(--accent-ink)}
  .msg h4:first-child{margin-top:0}
  .msg ul,.msg ol{margin:0 0 8px;padding-left:20px}.msg li{margin:3px 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
  .chip{border:1px solid var(--accent);background:#fff;color:var(--accent-ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
  .chip:hover:not(:disabled){background:var(--accent-soft)}
  .chip:disabled{opacity:.4;cursor:default}
  .chip.picked{background:var(--accent);color:#fff;opacity:1}
  .chip.back{border-color:#cdbfb1;color:var(--muted)}
  .chip.done{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .chip.done:hover:not(:disabled){background:#000}
  .chips .sep{flex-basis:100%;height:0}
  .other-box{flex-basis:100%;display:flex;gap:8px;margin-top:2px}
  .other-box input{flex:1;padding:9px 12px;border-radius:999px;font-size:14px}
  .other-box button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:0 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .cards{display:grid;gap:10px;align-self:stretch;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:pop .2s ease-out}
  .card h3{margin:0;font-family:Fraunces,serif;font-size:17px}
  .card .why{color:var(--muted);font-size:14px;line-height:1.45}
  .meta{display:flex;gap:8px;font-size:12px}
  .meta span{background:var(--accent-soft);color:var(--accent-ink);padding:3px 9px;border-radius:999px}
  .card button{align-self:flex-start;margin-top:4px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .card button:hover{filter:brightness(.95)}
  .card .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .card .actions button{margin-top:0}
  .yt{display:inline-flex;align-items:center;gap:6px;border:1px solid #e4d5c3;border-radius:10px;padding:7px 12px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;background:#fff}
  .yt:hover{background:var(--accent-soft)}
  .pic{position:relative;margin:-14px -16px 4px;border-radius:14px 14px 0 0;overflow:hidden;background:var(--accent-soft)}
  .pic img{display:block;width:100%;height:150px;object-fit:cover}
  .pic .credit{position:absolute;right:6px;bottom:6px;font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px;text-decoration:none}
  .chip.skip{border-style:dashed;border-color:#cdbfb1;color:var(--muted)}
  .typing{display:flex;gap:4px;padding:14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#c9b9a8;animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
  form{display:flex;gap:8px;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--bg)}
  input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  form button{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
  form button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🍳</div>
    <div>
      <h1>Rasoi Buddy</h1>
      <p>Can't cook? Can't decide? I've got you.</p>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Say hi, or type anything… e.g. “I have eggs, onion and rice”" autocomplete="off">
    <button id="send">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let aiOff = false;
let busy = false;
const prefs = {};       // mood, cuisine, diet, time, skill
const history = [];     // {role, content} for AI context
let shown = [];         // dishes already suggested

const MOODS = ['🍲 Comfort food','🌶️ Something spicy','🥗 Light & healthy','😴 Lazy, minimum effort','✨ Feeling fancy','🛺 Street food craving'];
const CUISINES = ['North Indian','South Indian','Andhra style','Kerala style','Indo-Chinese','Thai','Japanese','Italian','Mexican','🎲 Surprise me'];
const DIETS = ['🥦 Veg','🥚 Egg is fine','🍗 Non-veg'];
const TIMES = ['⚡ 15 mins','⏱️ ~30 mins','🕰️ I have an hour+'];
const SKILLS = ['😅 I can barely boil water','🙂 I can manage basics','😎 I\'m pretty decent'];
const ALLERGIES = ['Peanuts','Tree nuts (cashew, almond)','Dairy / milk','Gluten / wheat','Eggs','Soy','Sesame','Fish','Shellfish / prawns','Mushrooms','Onion & garlic'];

const FALLBACK = {
  'North Indian':{veg:['Rajma chawal','Paneer bhurji','Aloo paratha','Chole','Dal tadka','Aloo gobi'],non:['Butter chicken','Simple chicken curry','Keema matar','Egg bhurji','Chicken tikka','Anda curry']},
  'South Indian':{veg:['Lemon rice','Rava upma','Curd rice','Tomato rice','Bisi bele bath','Vegetable kurma'],non:['Egg roast','Pepper chicken','Chicken 65','Egg dosa','Chettinad chicken','Fish fry']},
  'Andhra style':{veg:['Tomato pappu','Pesarattu','Bendakaya fry','Gutti vankaya','Palakura pappu','Pulihora'],non:['Kodi kura','Egg pulusu','Chicken fry','Gongura chicken','Royyala vepudu','Natu kodi pulusu']},
  'Kerala style':{veg:['Kadala curry','Vegetable stew','Cabbage thoran','Avial','Puttu with kadala','Pulissery'],non:['Kerala egg curry','Chicken stew','Fish moilee','Beef fry','Chicken roast','Meen curry']},
  'Indo-Chinese':{veg:['Veg fried rice','Hakka noodles','Gobi manchurian','Chilli paneer','Schezwan noodles','Veg manchow soup'],non:['Egg fried rice','Chilli chicken','Chicken noodles','Dragon chicken','Chicken lollipop','Schezwan egg rice']},
  'Thai':{veg:['Veg green curry','Tofu pad thai','Thai basil fried rice','Veg red curry','Tom yum soup','Pineapple fried rice'],non:['Chicken green curry','Chicken pad thai','Pad kra pao','Chicken satay','Tom kha gai','Thai omelette']},
  'Japanese':{veg:['Veg yaki udon','Miso soup','Vegetable yakimeshi','Veg katsu curry','Okonomiyaki','Tofu teriyaki bowl'],non:['Chicken teriyaki','Oyakodon','Tamago fried rice','Chicken katsu','Chicken ramen','Tamagoyaki']},
  'Italian':{veg:['Aglio e olio','Tomato basil pasta','Mushroom risotto','Pasta arrabbiata','Margherita pizza','Minestrone'],non:['Chicken alfredo','Spaghetti bolognese','Chicken pesto pasta','Carbonara','Chicken lasagna','Chicken parmigiana']},
  'Mexican':{veg:['Bean quesadilla','Veg burrito bowl','Mexican rice','Veg nachos','Bean tacos','Corn salsa salad'],non:['Chicken tacos','Chicken quesadilla','Huevos rancheros','Chicken burrito','Chicken fajitas','Chicken enchiladas']}
};

/* ---------- helpers ---------- */
const clean = s => s.replace(/^[^\p{L}\p{N}]+/u,'').trim();
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scroll = () => chat.scrollTo({top: chat.scrollHeight, behavior:'smooth'});
const wait = ms => new Promise(r => setTimeout(r, ms));

function md(src){
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const close = () => { if(list){ out += `</${list}>`; list = null; } };
  for (let raw of lines){
    const l = raw.trim();
    if (!l){ close(); continue; }
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)/)) || (m = l.match(/^\*\*([^*]+)\*\*:?$/))){ close(); out += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = l.match(/^[-*•]\s+(.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out += `<li>${inline(m[1])}</li>`; }
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close();
  return out;
}

function addMsg(role, text, {html=false} = {}){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = html ? text : md(text);
  chat.appendChild(d); scroll();
  if (role === 'user') history.push({role:'user', content:text});
  else if (!html) history.push({role:'assistant', content:text});
  return d;
}

function typing(){
  const d = document.createElement('div');
  d.className = 'msg bot typing'; d.innerHTML = '<i></i><i></i><i></i>';
  chat.appendChild(d); scroll();
  return () => d.remove();
}

async function botSay(text){
  const stop = typing(); await wait(450); stop();
  return addMsg('bot', text);
}

function chips(options, onPick, back, skip){
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  if (back) addBack(wrap, back);
  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = opt; b.type = 'button';
    b.onclick = () => {
      if (busy) return;
      wrap.querySelectorAll('.chip').forEach(c => c.disabled = true);
      b.classList.add('picked');
      addMsg('user', opt);
      onPick(opt);
    };
    wrap.appendChild(b);
  });
  if (skip) addSkip(wrap, skip);
  chat.appendChild(wrap); scroll();
  return wrap;
}

// "Skip, just show me dishes" for people with no patience for questions
function addSkip(wrap, skip){
  const b = document.createElement('button');
  b.className = 'chip skip'; b.type = 'button'; b.textContent = '⏭️ Skip, just show me dishes';
  b.onclick = () => {
    if (busy) return;
    wrap.querySelectorAll('.chip, .other-box input, .other-box button').forEach(c => c.disabled = true);
    pendingMulti = null;
    skip();
  };
  wrap.appendChild(b);
}

function addBack(wrap, back){
  const b = document.createElement('button');
  b.className = 'chip back'; b.type = 'button'; b.textContent = '← Back';
  b.onclick = () => {
    if (busy) return;
    wrap.querySelectorAll('.chip').forEach(c => c.disabled = true);
    pendingMulti = null;
    back();
  };
  wrap.appendChild(b);
}

// multi-select chips for the kitchen step
let pendingMulti = null;
function multiChips(options, preselected, onDone, back, cfg, skip){
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  const state = {selected: new Set(), extras: [], wrap};
  pendingMulti = state;
  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = opt;
    if (preselected.includes(opt)){ b.classList.add('picked'); state.selected.add(opt); }
    b.onclick = () => {
      b.classList.toggle('picked');
      b.classList.contains('picked') ? state.selected.add(opt) : state.selected.delete(opt);
    };
    wrap.appendChild(b);
  });
  const sep = document.createElement('div'); sep.className = 'sep';
  // an ingredient typed via "Other" becomes its own chip, already ticked
  const addCustom = name => {
    if (!name || [...state.selected].some(x => x.toLowerCase() === name.toLowerCase())) return;
    const b = document.createElement('button');
    b.className = 'chip picked'; b.type = 'button'; b.textContent = name;
    state.selected.add(name);
    b.onclick = () => {
      b.classList.toggle('picked');
      b.classList.contains('picked') ? state.selected.add(name) : state.selected.delete(name);
    };
    wrap.insertBefore(b, otherChip);
  };
  state.addCustom = addCustom;
  const otherChip = document.createElement('button');
  otherChip.className = 'chip'; otherChip.type = 'button'; otherChip.textContent = '➕ Other';
  let box = null;
  otherChip.onclick = () => {
    if (box){ box.querySelector('input').focus(); return; }
    box = document.createElement('div'); box.className = 'other-box';
    box.innerHTML = `<input placeholder="${esc(cfg.placeholder)}"><button type="button">Add</button>`;
    const inp = box.querySelector('input');
    const add = () => {
      inp.value.split(/,|\band\b|\n/i).map(x => x.trim()).filter(Boolean)
        .forEach(x => addCustom(x.charAt(0).toUpperCase() + x.slice(1)));
      inp.value = ''; inp.focus();
    };
    box.querySelector('button').onclick = add;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); add(); } });
    wrap.insertBefore(box, sep);
    inp.focus(); scroll();
  };
  wrap.appendChild(otherChip);
  preselected.filter(x => !options.includes(x)).forEach(addCustom);
  wrap.appendChild(sep);
  const finish = (skip) => {
    if (busy) return;
    wrap.querySelectorAll('.chip, .other-box input, .other-box button').forEach(c => c.disabled = true);
    pendingMulti = null;
    const items = skip ? [] : [...state.selected];
    addMsg('user', items.length ? cfg.prefix + items.join(', ') : cfg.noneMsg);
    onDone(items.length ? items.join(', ') : cfg.noneValue);
  };
  const done = document.createElement('button');
  done.className = 'chip done'; done.type = 'button'; done.textContent = '✅ Done';
  done.onclick = () => finish(false);
  const none = document.createElement('button');
  none.className = 'chip'; none.type = 'button'; none.textContent = cfg.noneLabel;
  none.onclick = () => finish(true);
  wrap.appendChild(done); wrap.appendChild(none);
  if (back) addBack(wrap, back);
  if (skip) addSkip(wrap, skip);
  chat.appendChild(wrap); scroll();
}

function kitchenOptions(){
  const base = ['Onion','Tomato','Potato','Green chilli','Ginger-garlic','Capsicum','Carrot','Cabbage','Beans','Spinach / greens','Coconut','Lemon','Curd','Milk','Paneer','Rice','Dal','Atta','Bread','Noodles / pasta'];
  const d = (prefs.diet || '').toLowerCase();
  if (d.includes('egg') || d.includes('non')) base.push('Eggs');
  if (d.includes('non')) base.push('Chicken','Fish','Mutton','Prawns');
  return base;
}

function setBusy(v){ busy = v; sendBtn.disabled = v; }

/* ---------- AI ----------
   The page never talks to the AI directly. It sends what the person picked to
   our own small server file (/api/chat), which holds the secret API key and the
   prompts, asks Gemini, and sends the answer back.                              */
async function api(type, extra = {}){
  let r;
  try {
    r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type, prefs, shown, history: history.slice(-14), ...extra})
    });
  } catch(e){ throw {code:'offline'}; }
  const data = await r.json().catch(() => ({}));
  if (r.status === 429) throw {code:'rate_limited'};
  if (!r.ok) throw {code: r.status >= 500 || r.status === 404 ? 'offline' : 'error', message: data.error};
  return data;
}

function handleAIError(e){
  if (e && e.code === 'offline'){ aiOff = true; setStatus(); }
  const msg = e && e.code === 'rate_limited'
    ? "Lots of hungry people right now 😅 give me a minute and try again."
    : aiOff ? "My AI brain is taking a break, so I'll stick to the quick picks for now."
            : "Oops, something went wrong on my side. Try that again?";
  addMsg('bot', msg);
}

/* ---------- flow ---------- */
const STEPS = [
  {key:'mood',    label:'Mood',    q:() => "So… what's the mood like today?", opts:() => MOODS},
  {key:'cuisine', label:'Cuisine', q:() => `${prefs.mood || 'Nice'}, love it. Which cuisine are you feeling?`, opts:() => CUISINES,
     map: c => { if (/surprise/i.test(c)){ const k = Object.keys(FALLBACK); return k[Math.floor(Math.random()*k.length)]; } return c; }},
  {key:'diet',    label:'Diet',    q:() => `${prefs.cuisine || 'Okay'} it is! Veg or non-veg?`, opts:() => DIETS},
  {key:'allergies', label:'Allergies', multi:true,
     q:() => "Anything you're **allergic to** or don't eat? 🚫 Tap them, or tap **➕ Other** to type your own. I'll keep them out of everything I suggest.",
     opts:() => ALLERGIES,
     cfg:{prefix:'Please avoid: ', noneLabel:'🙅 No allergies', noneValue:'none', noneMsg:'No allergies 👍', placeholder:'e.g. mustard, brinjal, coconut'}},
  {key:'kitchen', label:'Kitchen', multi:true,
     cfg:{prefix:'I have: ', noneLabel:"🛒 Skip, I'll shop", noneValue:'nothing specific, happy to shop', noneMsg:"Not much honestly, I'm happy to buy what's needed", placeholder:'e.g. leftover rice, cheese, mushrooms'},
     q:() => "What do you have in your kitchen right now? 🧺 Tap everything you've got. Something not on the list? Tap **➕ Other** and type it in. Then hit **Done**.",
     opts:() => kitchenOptions()},
  {key:'time',    label:'Time',    q:() => "How much time do you have?", opts:() => TIMES},
  {key:'skill',   label:'Skill',   q:() => "Last one, be honest 😄 how comfortable are you in the kitchen?", opts:() => SKILLS},
];

async function greet(first){
  await botSay(first
    ? "Hey there! 👋 I'm **Rasoi Buddy**. I help people who can't cook, or just can't decide what to cook."
    : "Hi hi! 👋 What's up?");
  ask(0);
}

// edit = true means we came from "Edit my choices", so go straight back to dishes afterwards
async function ask(i, edit=false){
  const step = STEPS[i];
  await botSay(step.q());
  const next = val => {
    prefs[step.key] = val;
    if (edit || i + 1 >= STEPS.length) suggest();
    else ask(i + 1);
  };
  const back = edit ? () => editMenu()
             : i > 0 ? () => { addMsg('user', '← Go back'); delete prefs[STEPS[i-1].key]; ask(i - 1); }
             : null;
  const skip = (!edit && i > 0) ? () => { addMsg('user', '⏭️ Skip, just show me dishes'); suggest(); } : null;
  if (step.multi){
    const cur = prefs[step.key];
    const pre = edit && cur && cur !== step.cfg.noneValue ? cur.split(', ') : [];
    multiChips(step.opts(), pre, next, back, step.cfg, skip);
  } else {
    chips(step.opts(), v => next(step.map ? step.map(clean(v)) : clean(v)), back, skip);
  }
}

async function editMenu(){
  await botSay("Sure! What do you want to change?");
  const short = v => v && v.length > 22 ? v.slice(0, 20) + '…' : (v || '—');
  const opts = STEPS.map(st => `${st.label}: ${short(prefs[st.key])}`);
  chips([...opts, '👍 Never mind'], v => {
    const i = STEPS.findIndex(st => v.startsWith(st.label + ':'));
    if (i >= 0) ask(i, true); else afterDishes();
  });
}

const ytLink = name => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + ' recipe');

// Real photo from Wikipedia, only when the dish has its own article. No match = no photo.
const photoCache = {};
async function loadPhoto(card, title){
  if (!title) return;
  try {
    if (!(title in photoCache)){
      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
      const d = r.ok ? await r.json() : null;
      photoCache[title] = d && d.type === 'standard' && d.thumbnail
        ? {src: d.thumbnail.source, page: d.content_urls && d.content_urls.desktop.page} : null;
    }
    const p = photoCache[title];
    if (!p) return;
    const pic = card.querySelector('.pic');
    pic.innerHTML = `<img src="${esc(p.src)}" alt="${esc(title)}" loading="lazy"><a class="credit" href="${esc(p.page || '#')}" target="_blank" rel="noopener">Photo: Wikipedia</a>`;
    pic.querySelector('img').onerror = () => { pic.hidden = true; };
    pic.hidden = false;
  } catch(e){ /* no photo, no problem */ }
}

function fallbackDishes(){
  const set = FALLBACK[prefs.cuisine] || FALLBACK['North Indian'];
  const pool = (/non/i.test(prefs.diet) ? set.non : set.veg).filter(d => !shown.includes(d));
  return (pool.length ? pool : set.veg).slice(0,6).map(n => ({name:n, why:'A solid pick for today.', time:'', level:''}));
}

async function suggest(more){
  setBusy(true);
  const stop = typing();
  let reply, dishes;
  if (!aiOff){
    try {
      const res = await api('suggest', {more: !!more});
      reply = res.data.reply; dishes = res.data.dishes || [];
    } catch(e){
      if (e.code === 'rate_limited'){ stop(); setBusy(false); handleAIError(e); return afterDishes(); }
      if (e.code === 'offline'){ aiOff = true; setStatus(); }
    }
  }
  if (!dishes || !dishes.length){ dishes = fallbackDishes(); reply = "Here's what I'd make:"; }
  stop(); setBusy(false);
  addMsg('bot', reply);
  showDishes(dishes);
  if (aiOff && prefs.allergies && prefs.allergies !== 'none'){
    addMsg('bot', "⚠️ Heads up: in quick-pick mode I can't check these for your allergies, so please read the ingredients carefully.");
  } else if (!prefs.allergies){
    addMsg('bot', "Got any food allergies? Just type them (like 'no peanuts') and I'll redo the list. 🙂");
  }
  afterDishes();
}

function showDishes(dishes){
  if (!dishes || !dishes.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'cards';
  dishes.forEach(d => {
    shown.push(d.name);
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="pic" hidden></div>
      <h3>${esc(d.name)}</h3>
      ${d.why ? `<div class="why">${esc(d.why)}</div>` : ''}
      <div class="meta">${d.time ? `<span>⏱ ${esc(d.time)}</span>` : ''}${d.level ? `<span>${esc(d.level)}</span>` : ''}</div>
      <div class="actions">
        <button type="button">Recipe please 👩‍🍳</button>
        <a class="yt" href="${ytLink(d.name)}" target="_blank" rel="noopener">▶ YouTube</a>
      </div>`;
    c.querySelector('button').onclick = () => { if (!busy){ addMsg('user', `Recipe for ${d.name} please!`); recipe(d.name); } };
    wrap.appendChild(c);
    loadPhoto(c, d.wiki || d.name);
  });
  chat.appendChild(wrap); scroll();
  history.push({role:'assistant', content:`(suggested: ${dishes.map(d=>d.name).join(', ')})`});
}

function afterDishes(){
  chips(['🔄 Show me more','✏️ Edit my choices','🏁 Start over'], v => {
    if (/more/i.test(v)) suggest(true);
    else if (/edit/i.test(v)) editMenu();
    else restart();
  });
}

async function recipe(name){
  if (aiOff){
    addMsg('bot', `I'd love to walk you through **${name}**, but my AI side is taking a break 🙈 Here are some videos instead:`);
    return addMsg('bot', `<a class="yt" href="${ytLink(name)}" target="_blank" rel="noopener">▶ Watch ${esc(name)} recipes on YouTube</a>`, {html:true});
  }
  setBusy(true);
  const stop = typing();
  try {
    const res = await api('recipe', {dish: name});
    stop();
    addMsg('bot', res.text);
    history[history.length-1] = {role:'assistant', content:`(gave recipe for ${name})`};
    addMsg('bot', `Prefer to watch? <a class="yt" href="${ytLink(name)}" target="_blank" rel="noopener">▶ ${esc(name)} on YouTube</a>`, {html:true});
  } catch(e){ stop(); handleAIError(e); }
  setBusy(false);
  chips(['😋 Another dish idea','✏️ Edit my choices','🏁 Start over'], v =>
    /another/i.test(v) ? suggest(true) : /edit/i.test(v) ? editMenu() : restart());
}

async function freeText(text){
  addMsg('user', text);
  if (pendingMulti){
    const items = text.split(/,|\band\b|\n/i).map(x => x.trim()).filter(Boolean);
    items.forEach(x => pendingMulti.addCustom(x.charAt(0).toUpperCase() + x.slice(1)));
    history.pop();
    return botSay(`Added **${items.join(', ')}** ✓ Anything else? Then hit **Done**.`);
  }
  const isGreeting = /^(hi+|hey+|hello+|hii+|yo|sup|wassup|namaste|hola)\b/i.test(text.trim()) && text.trim().split(/\s+/).length <= 3;
  if (isGreeting && !prefs.mood) return greet(false);
  if (aiOff){
    return botSay("I'm on quick-pick mode right now, so tap one of the options and I'll take it from there 🙂");
  }
  setBusy(true);
  const stop = typing();
  try {
    const res = (await api('chat')).data;
    stop(); setBusy(false);
    if (res.prefs) Object.assign(prefs, res.prefs);
    if (res.reply) addMsg('bot', res.reply);
    if (res.recipe_for) return recipe(res.recipe_for);
    if (res.dishes && res.dishes.length){ showDishes(res.dishes); return afterDishes(); }
    if (res.chips && res.chips.length) chips(res.chips.slice(0,4), v => freeTextFromChip(v));
  } catch(e){ stop(); setBusy(false); handleAIError(e); }
}

// chips from the AI already echo the user's pick, so skip the echo here
async function freeTextFromChip(v){ history.pop(); freeText(v); }

function restart(){
  for (const k in prefs) delete prefs[k];
  shown = []; pendingMulti = null;
  greet(false);
}

function setStatus(){
  const on = !aiOff;
  document.getElementById('dot').classList.toggle('on', !!on);
  document.getElementById('statusText').textContent = on ? 'AI on' : 'Quick-pick mode';
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || busy) return;
  input.value = '';
  freeText(t);
});

/* ---------- start ---------- */
greet(true);
setStatus();
</script>
</body>
</html>
