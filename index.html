<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasoi Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6ee; --panel:#ffffff; --ink:#2b2420; --muted:#7a6f66;
    --accent:#e0791f; --accent-soft:#fde9d6; --accent-ink:#9a4b0b;
    --line:#eee3d4; --user:#2b2420; --userink:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
  .app{max-width:680px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  header{padding:18px 20px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:22px}
  header h1{font-family:Fraunces,serif;font-size:22px;margin:0;line-height:1.1}
  header p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
  .dot.on{background:#3aa55d}
  #chat{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:11px 14px;border-radius:16px;line-height:1.5;animation:pop .18s ease-out}
  .bot{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
  .user{background:var(--user);color:var(--userink);border-top-right-radius:4px;align-self:flex-end}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg p{margin:0 0 8px}.msg p:last-child{margin:0}
  .msg h4{font-family:Fraunces,serif;font-size:16px;margin:12px 0 6px;color:var(--accent-ink)}
  .msg h4:first-child{margin-top:0}
  .msg ul,.msg ol{margin:0 0 8px;padding-left:20px}.msg li{margin:3px 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
  .chip{border:1px solid var(--accent);background:#fff;color:var(--accent-ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
  .chip:hover:not(:disabled){background:var(--accent-soft)}
  .chip:disabled{opacity:.4;cursor:default}
  .chip.picked{background:var(--accent);color:#fff;opacity:1}
  .chip.back{border-color:#cdbfb1;color:var(--muted)}
  .chip.done{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .chip.done:hover:not(:disabled){background:#000}
  .chips .sep{flex-basis:100%;height:0}
  .other-box{flex-basis:100%;display:flex;gap:8px;margin-top:2px}
  .other-box input{flex:1;padding:9px 12px;border-radius:999px;font-size:14px}
  .other-box button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:0 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .cards{display:grid;gap:10px;align-self:stretch;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:pop .2s ease-out}
  .card h3{margin:0;font-family:Fraunces,serif;font-size:17px}
  .card .why{color:var(--muted);font-size:14px;line-height:1.45}
  .meta{display:flex;gap:8px;font-size:12px}
  .meta span{background:var(--accent-soft);color:var(--accent-ink);padding:3px 9px;border-radius:999px}
  .card button{align-self:flex-start;margin-top:4px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .card button:hover{filter:brightness(.95)}
  .card .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .card .actions button{margin-top:0}
  .yt{display:inline-flex;align-items:center;gap:6px;border:1px solid #e4d5c3;border-radius:10px;padding:7px 12px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;background:#fff}
  .yt:hover{background:var(--accent-soft)}
  .pic{position:relative;margin:-14px -16px 4px;border-radius:14px 14px 0 0;overflow:hidden;background:var(--accent-soft)}
  .pic img{display:block;width:100%;height:150px;object-fit:cover}
  .pic .credit{position:absolute;right:6px;bottom:6px;font-size:10.5px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px;text-decoration:none}
  .chip.skip{border-style:dashed;border-color:#cdbfb1;color:var(--muted)}
  .typing{display:flex;gap:4px;padding:14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#c9b9a8;animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
  form{display:flex;gap:8px;padding:12px 16px 18px;border-top:1px solid var(--line);background:var(--bg)}
  input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  form button{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
  form button:disabled{opacity:.5}
  .note{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 12px;margin-top:-8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🍳</div>
    <div>
      <h1>Rasoi Buddy</h1>
      <p>Can't cook? Can't decide? I've got you.</p>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Say hi, or type anything… e.g. “I have eggs, onion and rice”" autocomplete="off">
    <button id="send">Send</button>
  </form>
  <p class="note">🤖 I'm one smart cookie, but even cookies crumble sometimes. Got an allergy? Double-check the ingredients before you cook!</p>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let aiOff = false;
let busy = false;
const prefs = {};       // mood, cuisine, diet, time, skill
const history = [];     // {role, content} for AI context
let shown = [];         // dishes already suggested

const MOODS = ['🍲 Comfort food','🌶️ Something spicy','🥗 Light & healthy','😴 Lazy, minimum effort','✨ Feeling fancy','🛺 Street food craving'];
const CUISINES = ['North Indian','South Indian','Andhra style','Kerala style','Indo-Chinese','Thai','Japanese','Italian','Mexican','🎲 Surprise me'];
const DIETS = ['🥦 Veg','🥚 Egg is fine','🍗 Non-veg'];
const TIMES = ['⚡ 15 mins','⏱️ ~30 mins','🕰️ I have an hour+'];
const SKILLS = ['😅 I can barely boil water','🙂 I can manage basics','😎 I\'m pretty decent'];
const ALLERGIES = ['Peanuts','Tree nuts (cashew, almond)','Dairy / milk','Gluten / wheat','Eggs','Soy','Sesame','Fish','Shellfish / prawns','Mushrooms','Onion & garlic'];

const FALLBACK = {
  'North Indian':{veg:['Rajma chawal','Paneer bhurji','Aloo paratha','Chole','Dal tadka','Aloo gobi'],non:['Butter chicken','Simple chicken curry','Keema matar','Egg bhurji','Chicken tikka','Anda curry']},
  'South Indian':{veg:['Lemon rice','Rava upma','Curd rice','Tomato rice','Bisi bele bath','Vegetable kurma'],non:['Egg roast','Pepper chicken','Chicken 65','Egg dosa','Chettinad chicken','Fish fry']},
  'Andhra style':{veg:['Tomato pappu','Pesarattu','Bendakaya fry','Gutti vankaya','Palakura pappu','Pulihora'],non:['Kodi kura','Egg pulusu','Chicken fry','Gongura chicken','Royyala vepudu','Natu kodi pulusu']},
  'Kerala style':{veg:['Kadala curry','Vegetable stew','Cabbage thoran','Avial','Puttu with kadala','Pulissery'],non:['Kerala egg curry','Chicken stew','Fish moilee','Beef fry','Chicken roast','Meen curry']},
  'Indo-Chinese':{veg:['Veg fried rice','Hakka noodles','Gobi manchurian','Chilli paneer','Schezwan noodles','Veg manchow soup'],non:['Egg fried rice','Chilli chicken','Chicken noodles','Dragon chicken','Chicken lollipop','Schezwan egg rice']},
  'Thai':{veg:['Veg green curry','Tofu pad thai','Thai basil fried rice','Veg red curry','Tom yum soup','Pineapple fried rice'],non:['Chicken green curry','Chicken pad thai','Pad kra pao','Chicken satay','Tom kha gai','Thai omelette']},
  'Japanese':{veg:['Veg yaki udon','Miso soup','Vegetable yakimeshi','Veg katsu curry','Okonomiyaki','Tofu teriyaki bowl'],non:['Chicken teriyaki','Oyakodon','Tamago fried rice','Chicken katsu','Chicken ramen','Tamagoyaki']},
  'Italian':{veg:['Aglio e olio','Tomato basil pasta','Mushroom risotto','Pasta arrabbiata','Margherita pizza','Minestrone'],non:['Chicken alfredo','Spaghetti bolognese','Chicken pesto pasta','Carbonara','Chicken lasagna','Chicken parmigiana']},
  'Mexican':{veg:['Bean quesadilla','Veg burrito bowl','Mexican rice','Veg nachos','Bean tacos','Corn salsa salad'],non:['Chicken tacos','Chicken quesadilla','Huevos rancheros','Chicken burrito','Chicken fajitas','Chicken enchiladas']}
};

/* ---------- helpers ---------- */
const clean = s => s.replace(/^[^\p{L}\p{N}]+/u,'').trim();
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scroll = () => chat.scrollTo({top: chat.scrollHeight, behavior:'smooth'});
const wait = ms => new Promise(r => setTimeout(r, ms));

function md(src){
  const lines = esc(src).split('\n');
  let out = '', list = null;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const close = () => { if(list){ out += `</${list}>`; list = null; } };
  for (let raw of lines){
    const l = raw.trim();
    if (!l){ close();
